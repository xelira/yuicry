name: CLA

# pull_request_target runs on the base branch, so the workflow definition comes from
# `main` and cannot be altered by the pull request. Nothing from the pull request is
# checked out; only its text is read.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  signed:
    name: CLA signed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // The exact line from CONTRIBUTING.md.
            const CLA = /I have read the CLA\.md and I hereby sign the CLA/i;

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // The maintainer does not sign their own CLA.
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association)) {
              core.info('Maintainer or collaborator, skipping.');
              return;
            }

            if (CLA.test(pr.body || '')) {
              core.info('CLA line found in the pull request description.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            if (comments.some((c) => CLA.test(c.body || ''))) {
              core.info('CLA line found in a comment.');
              return;
            }

            core.setFailed(
              'CLA not signed. Add the line from CONTRIBUTING.md to the pull request ' +
              'description: "I have read the CLA.md and I hereby sign the CLA."'
            );
